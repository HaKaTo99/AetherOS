[package]
name = "aetheros-kernel"
version = "10.1.0"
edition = "2021"

[dependencies]
bootloader = { version = "0.9.8", features = ["map_physical_memory"] }
smoltcp = { version = "0.10", default-features = false, features = ["proto-ipv4", "socket-udp", "socket-tcp", "medium-ethernet", "log", "alloc"] }
log = { version = "0.4", default-features = false }
lazy_static = { version = "1.4", features = ["spin_no_std"] }
spin = "0.9.8"
x86_64 = "0.14.10"
uart_16550 = "0.3.0"


[features]
default = []
ui = [] # Enable UI Engine

# Development Profile
[profile.dev]
panic = "abort"
opt-level = 0

# Production Release Profile (Phase 10.1 - Optimized for v2.0)
[profile.release]
opt-level = 3              # Maximum optimization
lto = true                 # Link-Time Optimization
codegen-units = 1          # Single codegen unit
panic = "abort"            # Smaller binary
strip = false              # Keep symbols for Multiboot header  
overflow-checks = false    # Performance
debug = false              # No debug info

[lib]
name = "aetheros_kernel"
path = "src/lib.rs"

[[bin]]
name = "aetheros-kernel"
path = "src/main.rs"

