[package]
name = "aetheros-kernel"
version = "2.0.0"
edition = "2021"

[dependencies]

smoltcp = { version = "0.10", default-features = false, features = ["proto-ipv4", "socket-udp", "socket-tcp", "medium-ethernet", "log", "alloc"] }
log = { version = "0.4", default-features = false }
lazy_static = { version = "1.4", features = ["spin_no_std"] }
spin = "0.9"

[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }


[features]
default = []
ui = [] # Enable UI Engine

# Development Profile
[profile.dev]
panic = "abort"
opt-level = 0

# Production Release Profile (Phase 10.1 - Optimized for v2.0)
[profile.release]
opt-level = 3              # Maximum optimization
lto = true                 # Link-Time Optimization
codegen-units = 1          # Single codegen unit
panic = "abort"            # Smaller binary
strip = true               # Strip symbols  
overflow-checks = false    # Performance
debug = false              # No debug info

[lib]
name = "aetheros_kernel"
path = "src/lib.rs"

[[bin]]
name = "aetheros-kernel"
path = "src/main.rs"

[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio", "-display", "none"]
test-success-exit-code = 33
test-timeout = 300
