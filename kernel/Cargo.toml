[package]
name = "aetheros-kernel"
version = "10.1.0"
edition = "2021"

[dependencies]
smoltcp = { version = "0.10", default-features = false, features = ["proto-ipv4", "socket-udp", "socket-tcp", "medium-ethernet", "log", "alloc"] }
log = { version = "0.4", default-features = false, features = [] }
lazy_static = { version = "1.4", features = ["spin_no_std"] }
spin = "0.9.8"
x86_64 = "0.14.10"
uart_16550 = "0.3.0"
heapless = { version = "0.7.17", default-features = false, features = [] }
managed = { version = "0.8.0", default-features = false, features = ["map"] }
bitvec = "1.0.1"

[features]
default = []
ui = [] # Enable UI Engine
debug-input = [] # Enable shell input tracing diagnostics

[lib]
name = "aetheros_kernel"
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "aetheros-kernel"
path = "src/main.rs"
test = false
doctest = false
bench = false

# Production Profile - Optimized for stability and performance
[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
debug = false
panic = "abort"
strip = true
