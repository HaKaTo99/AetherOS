serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial gfxterm

# [v10.4.6] Enable High-Res Sovereign Graphics
insmod all_video
insmod gfxterm
set gfxpayload=keep

set timeout=3
set default=0

menuentry "AetherOS v10.4.6 (Supreme Grade)" {
    multiboot2 /boot/aetheros_kernel verbose
    boot
}
